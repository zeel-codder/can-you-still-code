<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Can You Still Code? — the no-AI coding challenge</title>
    <meta
      name="description"
      content="3 levels. No AI, no autocomplete, no paste. Find out how much coding is still in your brain and get a score, a rank and a friendly roast. ~5 minutes."
    />
    <meta name="author" content="ModuleZP" />
    <link rel="canonical" href="__SITE_ORIGIN__/" />
    <meta name="theme-color" content="#10b981" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- __SITE_ORIGIN__ is replaced at build time with SITE_URL (see vite.config.ts); crawlers need absolute URLs. -->

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn, Discord, Slack, Telegram, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Can You Still Code?" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:title" content="Can You Still Code? 🧠 The no-AI coding challenge" />

      property="og:description"
      content="3 levels. No AI, no autocomplete, no paste. Get a score, a rank and a friendly roast in ~5 minutes."
    />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:secure_url" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:site" content="@zeelprajapati__" />
    <meta name="twitter:creator" content="@zeelprajapati__" />

      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Can You Still Code?",
        "url": "__SITE_ORIGIN__/",
        "description": "A 3-level browser game that tests your coding without AI, autocomplete or paste.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "image": "__SITE_ORIGIN__/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
